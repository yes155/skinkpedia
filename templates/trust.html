{% extends "base.html" %}{% block content %}
<div class="container trust-page">
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><span aria-current="page">{{ title }}</span></nav>
  <article class="reading-width">
    {% if profile_image %}<img src="{{ profile_image }}?v=2" width="160" height="160" alt="{{ profile_alt }}" style="width:160px;height:160px;border-radius:999px;object-fit:cover;margin:0 0 22px;box-shadow:0 10px 28px rgba(32,40,35,.14)">{% endif %}
    <h1>{{ title }}</h1>
    <p class="byline article-meta-line" aria-label="Page credits and dates">{{ trust_label|safe }} · Published <time datetime="{{ date_published_iso }}">{{ date_published_display }}</time> · Updated <time datetime="{{ date_modified_iso }}">{{ date_modified_display }}</time></p>
    <div class="article-body">{{ body_html|safe }}</div>
  </article>
</div>
{% endblock %}
